<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intent Gate</title><link rel="stylesheet" href="popup.css"></head><body>
<main><header><img src="../icons/doctor-doom-48.png" width="37" height="37" alt=""><div><h1>Intent Gate</h1><p>How should YouTube Home open?</p></div></header>
<fieldset aria-label="YouTube Home mode"><legend class="sr-only">Choose a mode</legend>
<label><input type="radio" name="mode" value="off"><span><strong>Off</strong><small>Use YouTube normally.</small></span></label>
<label><input type="radio" name="mode" value="intention"><span><strong>Intention Gate</strong><small>Ask first, then search for your topic.</small></span></label>
<label><input type="radio" name="mode" value="no-doomscroll"><span><strong>No Doomscroll</strong><small>Hide Home recommendations and Shorts.</small></span></label>
<label><input type="radio" name="mode" value="watch-later"><span><strong>Watch Later</strong><small>Open your Watch Later playlist from Home.</small></span></label>
</fieldset><p id="status" role="status" aria-live="polite">Loading mode…</p></main>
<script src="../lib/storage.js"></script><script src="popup.js"></script></body></html>
